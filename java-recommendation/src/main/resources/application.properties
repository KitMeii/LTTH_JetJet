# ================================================================
# Server — 8081 (tournament-service da dung 8080, khong duoc trung)
# ================================================================
server.port=8081
spring.application.name=pdf-report-service

# ================================================================
# Database — dung chung SQL Server voi tournament-service + C# (Web_Stadium)
# Copy dung connection string tu tournament-service/application.properties
# (truoc day file nay tro sai may "NEMMM\CNAMM" voi user rieng java_user)
# ================================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=SanBongBTL;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:422005}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# QUAN TRONG: giu nguyen PascalCase/camelCase dung 100% ten that trong DB
# SanBongBTL (giong tournament-service) — khong de Spring Boot tu chuyen snake_case.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ================================================================
# JWT — dung chung secret voi tournament-service/appsettings.json cua C#
# de token dang nhap tao boi C# doc duoc o day.
# ================================================================
jwt.secret=${JWT_SECRET:SanBongBTL_SecretKey_2024_XYZ_MustBe32Chars}

# ================================================================
# CORS — chi cho phep frontend C# (Kestrel dev port 7045)
# ================================================================
cors.allowed-origins=https://localhost:7045

# ================================================================
# Swagger UI
# ================================================================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
