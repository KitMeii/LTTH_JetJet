# ================================================================
# Database — dung chung SQL Server voi app C# (Web_Stadium) hien co
# LUU Y: appsettings.json cua C# dang dung "Server=TunKittt" (ten may
# that), o day dung "localhost" theo yeu cau — neu Java chay tren
# CUNG may voi SQL Server thi localhost:1433 tuong duong. Neu khong
# ket noi duoc, doi DB_HOST ve "TunKittt".
# ================================================================
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=SanBongBTL;encrypt=false;trustServerCertificate=true
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:422005}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA — KHONG tu tao/sua schema, dung DB da co san (giong C#)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# QUAN TRONG: mac dinh Spring Boot tu chuyen ten bang/cot sang snake_case
# (VD: GiaiDaus -> giai_daus, TenGiai -> ten_giai) du da @Table/@Column chi
# dinh ro rang. Phai tat physical-strategy de giu nguyen PascalCase/camelCase
# dung 100% ten that trong DB SanBongBTL hien co.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Server — C# dung 7045/5290, Java dung 8080
server.port=8080
server.servlet.context-path=/api

# JWT — cung secret voi JWT:Secret trong appsettings.json cua C#
# de token dang nhap tao boi C# doc duoc o Java va nguoc lai
jwt.secret=${JWT_SECRET:SanBongBTL_SecretKey_2024_XYZ_MustBe32Chars}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail — copy tu Email section trong appsettings.json cua C#
# (LUU Y: gia tri goc trong C# la placeholder "your_email@gmail.com" /
# "xxxx xxxx xxxx xxxx" — chua phai App Password that, can dien that
# o ca 2 noi truoc khi gui email that su hoat dong)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:xxxx xxxx xxxx xxxx}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.sender-name=PitchHub

# CORS — frontend C# (Kestrel dev ports)
cors.allowed-origins=https://localhost:7045,http://localhost:5290

# Actuator
management.endpoints.web.exposure.include=health,info

logging.level.com.pitchhub.tournament=DEBUG
